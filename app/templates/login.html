<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Markify</title><link rel="stylesheet" href="/static/css/app.css?v=0.10.2"></head><body class="login-page"><div class="login-card"><div class="brand">MARKIFY</div><div class="eyebrow">Рабочее пространство</div><h1>Вход в Markify</h1><p>Управление маркировкой, сроками и печатью кухни.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary full-btn">Войти</button></form><div class="login-note">Для первого входа используйте данные из <code>.env</code>.</div></div></body></html>
